<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 배경 그라데이션: 인디고 → 보라 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>
    
    <!-- 배경에 은은한 빛 (부드러운 느낌) -->
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="20" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- 1. 앱 아이콘 배경 (둥근 사각형) -->
  <rect width="512" height="512" rx="100" fill="url(#bgGrad)" />

  <!-- 2. 배경에 은은한 빛 후광 (친근하고 포근한 느낌) -->
  <circle cx="256" cy="220" r="140" fill="#A855F7" opacity="0.2" filter="url(#softGlow)" />
  <circle cx="256" cy="220" r="80" fill="#6366F1" opacity="0.25" filter="url(#softGlow)" />

  <!-- 3. TV 프레임 (흰색, 둥글둥글) -->
  <!-- TV 바깥 테두리 -->
  <rect x="96" y="160" width="320" height="200" rx="28" fill="none" stroke="#FFFFFF" stroke-width="20" />
  
  <!-- TV 화면 내부 (투명하게 비워둠) -->
  <rect x="106" y="170" width="300" height="180" rx="20" fill="#FFFFFF" opacity="0.08" />

  <!-- TV 받침대 (다리) -->
  <rect x="216" y="360" width="80" height="12" rx="6" fill="#FFFFFF" />
  <rect x="196" y="372" width="120" height="6" rx="3" fill="#FFFFFF" opacity="0.5" />

  <!-- 4. Wi-Fi 신호 아크 (어디서나 연결) - TV 위에 배치 -->
  <g stroke="#FFFFFF" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- 첫 번째 호 (안쪽) -->
    <path d="M 234 126 A 22 22 0 0 1 278 126" stroke-width="12" />
    <!-- 두 번째 호 (중간) -->
    <path d="M 216 98 A 40 40 0 0 1 296 98" stroke-width="12" />
    <!-- 세 번째 호 (바깥쪽) -->
    <path d="M 198 70 A 58 58 0 0 1 314 70" stroke-width="12" />
  </g>
  <!-- Wi-Fi 중앙 점 -->
  <circle cx="256" cy="148" r="10" fill="#FFFFFF" />

  <!-- 5. TV 화면 안쪽에 작은 재생 버튼 (시청을 상징) -->
  <polygon points="228,246 228,296 296,271" fill="#FFFFFF" opacity="0.7" />
</svg>