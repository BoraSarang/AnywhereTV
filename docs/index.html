<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>어디서나 TV — AnywhereTV</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 24px;
      padding: 48px 40px;
      max-width: 520px;
      width: 100%;
      text-align: center;
      backdrop-filter: blur(12px);
    }
    .logo { font-size: 56px; margin-bottom: 8px; }
    h1 { font-size: 28px; font-weight: 700; letter-spacing: -0.5px; }
    .subtitle { color: rgba(255,255,255,0.6); font-size: 14px; margin-top: 4px; }
    .version-badge {
      display: inline-block;
      margin-top: 12px;
      padding: 4px 16px;
      background: rgba(83,52,131,0.6);
      border: 1px solid rgba(83,52,131,0.8);
      border-radius: 20px;
      font-size: 13px;
      color: #c4b5fd;
    }
    .platforms { margin-top: 36px; display: flex; flex-direction: column; gap: 12px; }
    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 16px 24px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
    }
    .btn-android {
      background: #22c55e;
      color: #fff;
    }
    .btn-android:hover { background: #16a34a; transform: translateY(-1px); }
    .btn-macos {
      background: #6366f1;
      color: #fff;
    }
    .btn-macos:hover { background: #4f46e5; transform: translateY(-1px); }
    .btn-secondary {
      background: rgba(255,255,255,0.08);
      color: rgba(255,255,255,0.8);
      font-size: 13px;
      padding: 12px 20px;
    }
    .btn-secondary:hover { background: rgba(255,255,255,0.14); }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      transform: none;
    }
    .info { margin-top: 28px; font-size: 13px; color: rgba(255,255,255,0.4); line-height: 1.6; }
    .info a { color: rgba(255,255,255,0.5); }
    .info a:hover { color: #fff; }
    .spinner {
      display: inline-block;
      width: 18px;
      height: 18px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: rgba(255,255,255,0.5); font-size: 14px; margin: 20px 0; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .error-text { color: #f87171; font-size: 14px; margin: 16px 0; }
    .note { margin-top: 16px; font-size: 12px; color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">📺</div>
    <h1>어디서나 TV</h1>
    <p class="subtitle">AnywhereTV — 실시간 TV 스트리밍</p>
    <div class="version-badge" id="versionBadge">v1.0.0</div>

    <div id="downloads">
      <div class="loading-text"><span class="spinner"></span> 최신 릴리스 확인 중...</div>
    </div>

    <div class="info">
      <p>제작: <a href="https://github.com/BoraSarang">OkStart</a></p>
      <p>문의: <a href="mailto:okstart@gmail.com">okstart@gmail.com</a></p>
      <p>후원: <a href="https://buymeacoffee.com/okstart" target="_blank">Buy Me a Coffee</a></p>
    </div>
  </div>

  <script>
    async function loadRelease() {
      const el = document.getElementById('downloads');
      try {
        const res = await fetch('https://api.github.com/repos/BoraSarang/AnywhereTV/releases/latest');
        if (!res.ok) throw new Error('No releases yet');
        const release = await res.json();
        const tag = release.tag_name;
        const version = tag.startsWith('v') ? tag.slice(1) : tag;

        document.getElementById('versionBadge').textContent = tag;

        const apk = release.assets.find(a => a.name.endsWith('.apk'));
        const macos = release.assets.find(a => a.name.endsWith('-macos.zip'));

        el.innerHTML = `
          <div class="platforms">
            ${apk ? `<a class="btn btn-android" href="${apk.browser_download_url}">
              <span>📱</span> Android APK 다운로드
            </a>` : ''}
            ${macos ? `<a class="btn btn-macos" href="${macos.browser_download_url}">
              <span>💻</span> macOS 다운로드
            </a>` : ''}
            <a class="btn btn-secondary" href="${release.html_url}">
              GitHub에서 보기
            </a>
          </div>
        `;
      } catch {
        el.innerHTML = `
          <div class="platforms">
            <div class="error-text">아직 릴리스가 없습니다</div>
            <a class="btn btn-secondary" href="https://github.com/BoraSarang/AnywhereTV/releases">
              GitHub Releases
            </a>
          </div>
        `;
      }
    }
    loadRelease();
  </script>
</body>
</html>
