name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 2.4.0)'
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: anywhere_tv
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Decode keystore (if present)
        run: |
          if [ -n "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > /tmp/upload-keystore.jks
          fi

      - name: Build APK
        run: flutter build apk --release
        env:
          ANDROID_STORE_FILE: /tmp/upload-keystore.jks
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-apk
          path: anywhere_tv/build/app/outputs/flutter-apk/app-release.apk
          compression-level: 0

  build-macos:
    name: Build macOS App
    runs-on: macos-latest
    defaults:
      run:
        working-directory: anywhere_tv
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.6'
          channel: 'stable'

      - name: Ensure macOS platform
        run: |
          flutter config --enable-macos-desktop
          flutter create --platforms=macos .
          flutter pub get

      - name: Build macOS
        run: flutter build macos --release

      - name: Zip .app
        run: ditto -c -k --sequesterRsrc --keepParent build/macos/Build/Products/Release/AnywhereTV.app build/macos/Build/Products/Release/AnywhereTV.zip

      - name: Upload macOS ZIP
        uses: actions/upload-artifact@v4
        with:
          name: anywheretv-macos
          path: anywhere_tv/build/macos/Build/Products/Release/AnywhereTV.zip
          compression-level: 0

  create-release:
    name: Create GitHub Release
    needs: [build-android, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Normalize version tag
        id: ver
        run: |
          v="${VERSION}"
          case "$v" in
            v*) tag="$v" ;;
            *)  tag="v$v" ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "num=${tag#v}" >> "$GITHUB_OUTPUT"

      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: app-release-apk
          path: release-artifacts

      - name: Download macOS ZIP
        uses: actions/download-artifact@v4
        with:
          name: anywheretv-macos
          path: release-artifacts

      - name: List artifacts
        run: find release-artifacts -type f

      - name: Rename APK
        run: |
          apk=$(find release-artifacts -name "*.apk" | head -1)
          mv "$apk" "release-artifacts/AnywhereTV-${{ steps.ver.outputs.num }}.apk"

      - name: Rename ZIP
        run: |
          zip=$(find release-artifacts -name "*.zip" | head -1)
          mv "$zip" "release-artifacts/AnywhereTV-${{ steps.ver.outputs.num }}-macos.zip"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: AnywhereTV ${{ steps.ver.outputs.tag }}
          generate_release_notes: true
          files: release-artifacts/*
          fail_on_unmatched_files: true
